<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Polaris"/>
  <meta name="theme-color" content="#000000"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <title>Polaris</title>
</head>
<body>

  <!-- ══ LIQUID BACKGROUND SYSTEM ══ -->
  <div id="bg-root">
    <div id="bg-gradient"></div>
    <div id="bg-mesh">
      <div class="mesh-orb" id="orb-a"></div>
      <div class="mesh-orb" id="orb-b"></div>
      <div class="mesh-orb" id="orb-c"></div>
      <div class="mesh-orb" id="orb-d"></div>
    </div>
    <div id="bg-blur-layer"></div>
    <canvas id="grain-canvas"></canvas>
  </div>

  <!-- ══ REACTIVE COVER BLUR (song screen) ══ -->
  <div id="cover-blur-bg"></div>

  <!-- ══ PARTICLE FIELD ══ -->
  <canvas id="particle-canvas"></canvas>

  <!-- ══ APP SHELL ══ -->
  <div id="app">

    <!-- ─────────────────────────────────────
         SCREEN 1 · HOME
    ───────────────────────────────────────── -->
    <div id="screen-home" class="screen active">

      <!-- Status bar area -->
      <div class="status-bar">
        <span class="status-time" id="status-time">9:41</span>
        <div class="status-icons">
          <svg width="16" height="12" viewBox="0 0 16 12" fill="white" opacity="0.8">
            <rect x="0" y="4" width="3" height="8" rx="1"/>
            <rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/>
            <rect x="9" y="0.5" width="3" height="11.5" rx="1"/>
            <rect x="13.5" y="0" width="2.5" height="12" rx="1" opacity="0.3"/>
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="white" opacity="0.8">
            <path d="M8 2C10.5 2 12.7 3.1 14.2 4.8L15.5 3.5C13.6 1.3 11 0 8 0C5 0 2.4 1.3 0.5 3.5L1.8 4.8C3.3 3.1 5.5 2 8 2Z"/>
            <path d="M8 5C9.7 5 11.2 5.7 12.3 6.8L13.6 5.5C12.1 4.1 10.1 3.2 8 3.2C5.9 3.2 3.9 4.1 2.4 5.5L3.7 6.8C4.8 5.7 6.3 5 8 5Z"/>
            <circle cx="8" cy="10" r="2"/>
          </svg>
          <div class="battery-icon">
            <div class="battery-fill"></div>
          </div>
        </div>
      </div>

      <!-- Header -->
      <header class="home-header">
        <div class="logo-lockup" id="logo-lockup">
          <div class="logo-mark" id="logo-mark">
            <svg viewBox="0 0 36 36" fill="none">
              <circle cx="18" cy="18" r="17" stroke="white" stroke-width="0.5" opacity="0.2"/>
              <polygon points="18,3 21,13 31,13 23,19 26,29 18,23 10,29 13,19 5,13 15,13"
                fill="white" opacity="0.08"/>
              <polygon points="18,6 20.5,13.5 28,13.5 22,18 24.5,26 18,21.5 11.5,26 14,18 8,13.5 15.5,13.5"
                fill="white" opacity="0.4"/>
              <circle cx="18" cy="18" r="2.5" fill="white"/>
              <line x1="18" y1="0" x2="18" y2="7" stroke="white" stroke-width="1" opacity="0.3"/>
              <line x1="18" y1="29" x2="18" y2="36" stroke="white" stroke-width="1" opacity="0.3"/>
              <line x1="0" y1="18" x2="7" y2="18" stroke="white" stroke-width="1" opacity="0.3"/>
              <line x1="29" y1="18" x2="36" y2="18" stroke="white" stroke-width="1" opacity="0.3"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="logo-wordmark">POLARIS</span>
            <span class="logo-sub">Your emotional compass</span>
          </div>
        </div>

        <button class="icon-btn" id="search-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="11" cy="11" r="7"/>
            <line x1="16.5" y1="16.5" x2="22" y2="22"/>
          </svg>
        </button>
      </header>

      <!-- Greeting -->
      <div class="home-greeting">
        <p class="greeting-eyebrow">Right now</p>
        <h1 class="greeting-headline">How are you <em>feeling</em>?</h1>
      </div>

      <!-- Emotions Grid -->
      <div id="emotions-grid" class="emotions-grid"></div>

      <!-- Bottom hint -->
      <div class="home-hint">
        <span class="hint-dot"></span>
        <span>Tap a mood · Discover your soundtrack</span>
      </div>

    </div>

    <!-- ─────────────────────────────────────
         SCREEN 2 · EMOTION
    ───────────────────────────────────────── -->
    <div id="screen-emotion" class="screen">

      <!-- Nav bar -->
      <nav class="nav-bar">
        <button class="back-btn glass-btn" id="back-emotion">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15,18 9,12 15,6"/>
          </svg>
        </button>
        <span class="nav-title" id="nav-emotion-title"></span>
        <div class="nav-spacer"></div>
      </nav>

      <!-- Hero -->
      <div class="emotion-hero">
        <div class="hero-emoji" id="hero-emoji"></div>
        <div class="hero-text">
          <h2 class="hero-title" id="hero-title"></h2>
          <p class="hero-desc" id="hero-desc"></p>
        </div>
        <div class="hero-chips" id="hero-chips"></div>
      </div>

      <!-- Genre strip -->
      <div class="strip-label">Genres</div>
      <div class="genre-strip" id="genre-strip"></div>

      <!-- Songs -->
      <div class="strip-label" style="margin-top:24px">
        <span>Tracks</span>
        <span class="label-count" id="tracks-count"></span>
      </div>
      <div class="tracks-list" id="tracks-list"></div>

      <!-- Shuffle CTA -->
      <button class="shuffle-cta" id="shuffle-btn">
        <div class="shuffle-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16,3 21,3 21,8"/>
            <line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21,16 21,21 16,21"/>
            <line x1="4" y1="4" x2="9" y2="9"/>
          </svg>
        </div>
        <span>Shuffle Play</span>
        <div class="shuffle-arrow">→</div>
      </button>

    </div>

    <!-- ─────────────────────────────────────
         SCREEN 3 · SONG DETAIL
    ───────────────────────────────────────── -->
    <div id="screen-song" class="screen">

      <!-- Nav bar -->
      <nav class="nav-bar">
        <button class="back-btn glass-btn" id="back-song">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15,18 9,12 15,6"/>
          </svg>
        </button>
        <span class="nav-title">Song Story</span>
        <div class="nav-spacer"></div>
      </nav>

      <!-- Cover hero -->
      <div class="song-cover-hero" id="song-cover-hero">
        <!-- Reactive blur backdrop -->
        <div class="cover-aura" id="cover-aura"></div>
        <!-- 3D tiltable cover -->
        <div class="cover-3d-wrapper" id="cover-3d">
          <div class="cover-card" id="cover-card">
            <img class="cover-img" id="cover-img" src="" alt=""/>
            <div class="cover-gloss"></div>
            <div class="cover-rim"></div>
          </div>
        </div>
        <!-- Floating info pill -->
        <div class="cover-pill" id="cover-pill">
          <img class="pill-thumb" id="pill-thumb" src="" alt=""/>
          <div class="pill-text">
            <span class="pill-title" id="pill-title"></span>
            <span class="pill-artist" id="pill-artist"></span>
          </div>
          <div class="pill-wave">
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
          </div>
        </div>
      </div>

      <!-- Song info -->
      <div class="song-info-block">
        <span class="song-genre-pill" id="song-genre-pill"></span>
        <h2 class="song-name" id="song-name"></h2>
        <p class="song-by" id="song-by"></p>
      </div>

      <!-- Story card -->
      <div class="story-glass-card">
        <div class="story-card-header">
          <div class="story-header-left">
            <span class="story-icon-wrap">📖</span>
            <span class="story-card-title">The Story</span>
          </div>
          <div class="lang-switch" id="lang-switch">
            <button class="lang-opt active" data-lang="en">EN</button>
            <button class="lang-opt" data-lang="ar">عر</button>
            <div class="lang-pill-indicator" id="lang-indicator"></div>
          </div>
        </div>
        <div class="story-content">
          <p class="story-p ltr" id="story-en"></p>
          <p class="story-p rtl hidden" id="story-ar"></p>
        </div>
      </div>

      <!-- Spotify CTA -->
      <a class="spotify-cta" id="spotify-cta" href="#" target="_blank" rel="noopener">
        <div class="spotify-logo-wrap">
          <svg viewBox="0 0 24 24" width="26" height="26">
            <circle cx="12" cy="12" r="12" fill="#1DB954"/>
            <path d="M17.9 10.9C14.7 9 9.35 8.8 6.3 9.75c-.5.15-1-.15-1.15-.6-.15-.5.15-1 .6-1.15 3.55-1.05 9.4-.85 13.1 1.35.45.25.6.85.35 1.3-.25.35-.85.5-1.3.25zm-.1 2.8c-.25.4-.75.5-1.15.25-2.7-1.65-6.8-2.15-9.95-1.15-.4.1-.85-.1-.95-.5-.1-.4.1-.85.5-.95 3.65-1.1 8.15-.55 11.25 1.35.4.25.5.75.3 1zm-1.3 2.8c-.2.35-.65.45-1 .25-2.35-1.45-5.3-1.75-8.8-.95-.35.1-.65-.15-.75-.45-.1-.35.15-.65.45-.75 3.8-.85 7.1-.5 9.7 1.1.35.15.45.65.4 1.05z" fill="white"/>
          </svg>
        </div>
        <span class="spotify-cta-text">Open in Spotify</span>
        <svg class="cta-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9,18 15,12 9,6"/>
        </svg>
      </a>

      <!-- Bottom padding -->
      <div style="height: 40px"></div>

    </div>

  </div>

  <!-- ══ TOAST NOTIFICATION ══ -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
